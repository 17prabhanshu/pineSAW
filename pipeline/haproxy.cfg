global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 10s
    timeout client  300s
    timeout server  300s

frontend socks5_in
    bind 0.0.0.0:9050
    mode tcp
    default_backend tor_pool

backend tor_pool
    mode tcp
    balance roundrobin
    # SOCKS5 health check using TCP connection
    option tcp-check
    server tor_node_1 tor1:9050 check fall 3 rise 2 weight 10
    server tor_node_2 tor2:9050 check fall 3 rise 2 weight 10
    server tor_node_3 tor3:9050 check fall 3 rise 2 weight 10
    server tor_node_4 tor4:9050 check fall 3 rise 2 weight 10

frontend stats
    bind 0.0.0.0:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats admin if TRUE
