version: "3.8"

networks:
  pinesaw-kafka-net:
    driver: bridge

services:
  # ============================================================================
  # APACHE KAFKA 3.7 (KRAFT MODE - ZERO ZOOKEEPER DEPENDENCY)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: pinesaw-kafka-broker
    restart: unless-stopped
    networks:
      - pinesaw-kafka-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # KAFKA UI - VISUAL TOPIC & CONSUMER DASHBOARD (OPTIONAL)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pinesaw-kafka-ui
    restart: unless-stopped
    networks:
      - pinesaw-kafka-net
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pinesaw-local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
